name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(sed -n 's/.*"AssemblyVersion": *"\([^"]*\)".*/\1/p' Chroma/Chroma.json)
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AssemblyVersion $manifest_version in Chroma/Chroma.json"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Chroma/packages.lock.json

      - name: Download Dalamud
        run: |
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Restore
        run: dotnet restore --locked-mode -p:EnableWindowsTargeting=true

      - name: Build
        run: dotnet build -c Release --no-restore -p:EnableWindowsTargeting=true

      - name: Generate checksum
        working-directory: Chroma/bin/x64/Release/Chroma
        run: sha512sum latest.zip > latest.zip.sha512

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Chroma ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Chroma/bin/x64/Release/Chroma/latest.zip
            Chroma/bin/x64/Release/Chroma/latest.zip.sha512
